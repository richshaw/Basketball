name: Deploy to GitHub Pages

# Deploy only what CI has tested: this runs after the CI workflow finishes on main.
# A CI run cancelled by a newer push (or a failed one) deploys nothing; the newest
# run to pass deploys its own commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Manual runs deploy the chosen branch; automatic ones only a successful CI run
    # for a push to main (not a pull request whose branch happens to be named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit CI tested, even if main has moved on since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # The encrypted cloud backup's server (server/, on Fly.io). Until it's deployed,
          # backups fail gracefully and the app says so; the data stays on the phone.
          VITE_BACKUP_API_URL: https://richshaw-hoop-stats.fly.dev
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
