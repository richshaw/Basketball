name: Server CI

# deploy-server.yml deploys after this workflow (by this name) passes for a push to main, so
# keep the push trigger below.
on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running checks. On main this also means
# only the newest commit's run can complete and trigger a deploy.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
